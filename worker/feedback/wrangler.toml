name = "finanzas-feedback"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
preview_urls = false

[vars]
REPO = "Leoglez10/finanzas"

# 5 reports per minute per IP.
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Secrets (not in this file): GITHUB_TOKEN, a fine-grained token with Issues: read and write on Leoglez10/finanzas only;
# RESEND_API_KEY and NOTIFY_EMAIL (the Resend account address) for an email on every new report (optional).
