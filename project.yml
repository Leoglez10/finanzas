name: Finanzas
options:
  developmentLanguage: es
  bundleIdPrefix: com.leoglez
  deploymentTarget:
    macOS: "15.0"
packages:
  FinanzasKit:
    path: FinanzasKit
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk.git
    exactVersion: 0.12.1
targets:
  Finanzas:
    type: application
    platform: macOS
    sources: [Finanzas]
    dependencies:
      - package: FinanzasKit
      - target: finanzas-mcp
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.leoglez.finanzas
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Finanzas
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
  finanzas-mcp:
    type: tool
    platform: macOS
    sources: [FinanzasMCP]
    dependencies:
      - package: FinanzasKit
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_NAME: finanzas-mcp
        SWIFT_VERSION: "6.0"
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: YES
