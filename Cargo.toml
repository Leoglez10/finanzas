[workspace]
resolver = "2"
members = ["crates/finanzas-core", "crates/finanzas-mcp", "crates/finanzas-app"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.2.0"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
lto = true
codegen-units = 1
strip = true
