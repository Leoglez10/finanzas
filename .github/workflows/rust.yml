name: Rust

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "FINANZAS_DB=$RUNNER_TEMP/finanzas-ci.db" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      # The desktop crate needs WebKit and a built frontend; it has its own job below.
      - run: cargo test --workspace --exclude finanzas-desktop
      - run: cargo clippy --workspace --exclude finanzas-desktop --all-targets -- -D warnings

  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - run: echo "FINANZAS_DB=$RUNNER_TEMP/finanzas-ci.db" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: cargo test -p finanzas-desktop
      - run: cargo clippy -p finanzas-desktop --all-targets -- -D warnings

  mcp:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p finanzas-mcp
