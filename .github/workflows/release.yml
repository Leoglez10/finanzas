name: Release

# Automatic releases: when `main` gets a workspace version (Cargo.toml) that has no `v<version>` tag
# yet, this builds the installers, creates the tag and publishes the GitHub Release. To ship a new
# version, bump `version` in Cargo.toml and merge. Pushing a `v*` tag by hand also releases.
# Pull requests that touch packaging, and manual runs, only build the installers as artifacts.
# Asset names carry no version, so https://github.com/<repo>/releases/latest/download/<name> stays valid.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml", "desktop/src-tauri/**", "desktop/package.json", "scripts/build.sh"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          crate="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            echo "version=$crate" >> "$GITHUB_OUTPUT"
            if gh release view "v$crate" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "release=false"; else echo "release=true"; fi >> "$GITHUB_OUTPUT"
          else
            echo "version=$crate-dev" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  package:
    needs: version
    if: needs.version.outputs.release == 'true' || github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04: an older glibc keeps the AppImage and .deb running on more distributions.
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Signs the update bundles; without it (pull requests, forks) only the installers are built.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
      - run: scripts/build.sh

      # Stable asset names, so https://github.com/<repo>/releases/latest/download/<name> keeps working.
      - name: Collect installers
        run: |
          b=target/release/bundle; mkdir -p dist
          copy() { [[ -f "$1" ]] && cp "$1" "$2" && { [[ ! -f "$1.sig" ]] || cp "$1.sig" "$2.sig"; }; }
          case "$RUNNER_OS" in
            macOS)
              cp "$b"/dmg/*.dmg dist/Finanzas-macos-arm64.dmg
              copy "$b/macos/Finanzas.app.tar.gz" dist/Finanzas-macos-arm64.app.tar.gz || true ;;
            Windows)
              setup="$(ls "$b"/nsis/*-setup.exe)"
              cp "$setup" dist/Finanzas-windows-x64-setup.exe
              [[ ! -f "$setup.sig" ]] || cp "$setup.sig" dist/Finanzas-windows-x64-setup.exe.sig ;;
            Linux)
              cp "$b"/deb/*.deb dist/finanzas-linux-amd64.deb
              image="$(ls "$b"/appimage/*.AppImage)"
              cp "$image" dist/Finanzas-linux-x86_64.AppImage
              [[ ! -f "$image.sig" ]] || cp "$image.sig" dist/Finanzas-linux-x86_64.AppImage.sig
              tar -czf dist/finanzas-linux-x86_64.tar.gz -C target/release finanzas finanzas-mcp ;;
          esac
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [version, package]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The in-app updater reads releases/latest/download/latest.json; each platform needs its .sig.
      - name: Write latest.json
        env:
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          version, repo = os.environ["VERSION"], os.environ["REPO"]
          assets = {"darwin-aarch64": "Finanzas-macos-arm64.app.tar.gz", "windows-x86_64": "Finanzas-windows-x64-setup.exe", "linux-x86_64": "Finanzas-linux-x86_64.AppImage"}
          platforms = {k: {"signature": open(f"dist/{v}.sig").read().strip(), "url": f"https://github.com/{repo}/releases/download/v{version}/{v}"}
                       for k, v in assets.items() if os.path.exists(f"dist/{v}.sig")}
          if not platforms: raise SystemExit("No update signatures: is TAURI_SIGNING_PRIVATE_KEY set?")
          json.dump({"version": version, "notes": f"Finanzas {version}", "pub_date": datetime.datetime.now(datetime.timezone.utc).isoformat(), "platforms": platforms}, open("dist/latest.json", "w"), indent=2)
          PY
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Finanzas ${{ needs.version.outputs.version }}
          files: dist/*
          generate_release_notes: true
          body: |
            Instaladores sin firma de Apple ni de Microsoft. Una vez instalada, Finanzas se actualiza sola.
            - macOS (Apple Silicon): `brew install --cask finanzas`, o abre el .dmg y arrastra Finanzas a Aplicaciones (la primera vez, clic derecho → Abrir).
            - Windows: ejecuta el setup; si aparece SmartScreen, "Más información" → "Ejecutar de todas formas".
            - Linux: `sudo apt install ./finanzas-linux-amd64.deb`, o el .AppImage (se actualiza solo).

  # Points the Homebrew cask (Casks/finanzas.rb, this repo is its own tap) at the new release.
  # Pushes made with GITHUB_TOKEN start no workflows, so this commit does not release again.
  cask:
    needs: [version, publish]
    runs-on: ubuntu-latest
    concurrency: { group: cask, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bump version and sha256
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern Finanzas-macos-arm64.dmg --dir "$RUNNER_TEMP"
          sha="$(sha256sum "$RUNNER_TEMP/Finanzas-macos-arm64.dmg" | cut -d' ' -f1)"
          sed -i -E "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/finanzas.rb
          if ! grep -qx "  version \"$VERSION\"" Casks/finanzas.rb || ! grep -qx "  sha256 \"$sha\"" Casks/finanzas.rb; then
            echo "Casks/finanzas.rb format changed; version/sha256 were not updated"; exit 1
          fi
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(cask): finanzas $VERSION"
          git pull --rebase origin main   # main may have moved while the installers were building
          git push origin HEAD:main
